stages:
  - lint
  - test
  - report

variables:
  BASE_URL: "https://mb.io"
  CI: "true"

.docker_image: &docker_image
  image: mcr.microsoft.com/playwright:v1.48.0-jammy

lint:
  <<: *docker_image
  stage: lint
  script:
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

smoke:
  <<: *docker_image
  stage: test
  script:
    - npm ci
    - npx playwright test --grep @smoke --project=chromium
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/junit-results.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

regression:
  <<: *docker_image
  stage: test
  parallel:
    matrix:
      - BROWSER: [chromium, firefox, webkit]
  script:
    - npm ci
    - npx playwright test --grep @regression --project=$BROWSER
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/junit-results.xml
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

publish_html_report:
  stage: report
  needs: ["smoke", "regression"]
  script:
    - echo "Publishing Playwright HTML report as a pipeline artifact"
  artifacts:
    paths:
      - reports/html-report/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
